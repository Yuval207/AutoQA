server:
  port: ${PORT:8081}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE_MB:100}MB
      max-request-size: ${MAX_UPLOAD_SIZE_MB:100}MB

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-nameless-breeze-b5em49z5-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:npg_N9eOgnEqpj4C}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 60000
      idle-timeout: 30000
      keepalive-time: 15000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

autoqa:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-in-production-must-be-at-least-64-characters-long-for-hs512}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  storage:
    artifacts-path: ${ARTIFACT_STORAGE_PATH:./data/artifacts}
    uploads-path: ${UPLOAD_STORAGE_PATH:./data/uploads}
    workspaces-path: ${WORKSPACE_PATH:./data/workspaces}
  limits:
    max-upload-size-mb: ${MAX_UPLOAD_SIZE_MB:100}
    max-extracted-size-mb: ${MAX_EXTRACTED_SIZE_MB:500}
    execution-timeout-seconds: ${EXECUTION_TIMEOUT_SECONDS:300}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.autoqa: DEBUG
    org.springframework.security: INFO
