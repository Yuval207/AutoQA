version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: autoqa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoqa}
      POSTGRES_USER: ${POSTGRES_USER:-autoqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoqa_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoqa}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
